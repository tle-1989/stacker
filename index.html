<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #101524;
      color: #f4f6ff;
      font: 1rem system-ui, sans-serif;
    }
    main { width: min(100%, 390px); }
    header { display: flex; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 2.5rem; letter-spacing: -.06em; }
    #score { font-variant-numeric: tabular-nums; color: #8cebd7; }
    p { color: #c0c9df; margin: 8px 0 16px; }
    canvas {
      width: 100%;
      max-height: 58svh;
      display: block;
      border: 1px solid #3c4866;
      border-radius: 16px;
      background: #182137;
      cursor: pointer;
      touch-action: manipulation;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #8cebd7;
      color: #101524;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    #altitude { margin: 8px 0 0; font-size: .875rem; color: #8cebd7; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stacker</h1>
      <span id="score">Score 0</span>
    </header>
    <p>Line up each block with the one below it. Tap the board or press Space to place it.</p>
    <canvas id="board" width="720" height="900" aria-label="Stacker game board">
      Your browser needs canvas support to play Stacker.
    </canvas>
    <button id="action" type="button">Start game</button>
    <p id="altitude">Open sky · Clouds at 10 blocks</p>
    <p id="status" role="status">Ready to play.</p>
  </main>
  <script>
    const board = document.querySelector('#board');
    const context = board.getContext('2d');
    const action = document.querySelector('#action');
    const score = document.querySelector('#score');
    const altitude = document.querySelector('#altitude');
    const status = document.querySelector('#status');

    const width = 360;
    const height = 450;
    const ground = 406;
    const blockHeight = 26;
    const colors = ['#8cebd7', '#8db5ff', '#c2aaff', '#ffaecb', '#ffd39a'];
    let tower;
    let moving;
    let debris;
    let phase;
    let camera;
    let lastFrame;
    let sceneryTime = 0;

    function reset() {
      tower = [{ x: 108, width: 144, y: ground - blockHeight, color: colors[0] }];
      moving = null;
      debris = [];
      camera = 0;
      phase = 'ready';
      score.textContent = 'Score 0';
      altitude.textContent = 'Open sky · Clouds at 10 blocks';
    }

    function spawn() {
      const top = tower.at(-1);
      moving = {
        x: 0,
        width: top.width,
        y: top.y - blockHeight,
        color: colors[tower.length % colors.length],
        direction: 1
      };
    }

    function play() {
      if (phase !== 'playing') {
        reset();
        phase = 'playing';
        action.textContent = 'Place block';
        status.textContent = 'Place the block when it lines up.';
        spawn();
        return;
      }

      const top = tower.at(-1);
      const movingRight = moving.x + moving.width;
      const left = Math.max(moving.x, top.x);
      const right = Math.min(movingRight, top.x + top.width);
      if (right <= left) {
        debris.push({ ...moving, age: 0, drift: moving.direction });
        moving = null;
        phase = 'over';
        action.textContent = 'Play again';
        status.textContent = 'Game over. Final score ' + (tower.length - 1) + '.';
        return;
      }

      if (moving.x < left) {
        debris.push({ ...moving, width: left - moving.x, age: 0, drift: -1 });
      }
      if (movingRight > right) {
        debris.push({ ...moving, x: right, width: movingRight - right, age: 0, drift: 1 });
      }

      tower.push({ x: left, width: right - left, y: moving.y, color: moving.color });
      const blocks = tower.length - 1;
      score.textContent = 'Score ' + blocks;
      altitude.textContent = sceneAt(blocks).label;
      spawn();
    }

    function drawBlock(block) {
      context.fillStyle = block.color;
      context.fillRect(block.x, block.y, block.width, blockHeight - 1);
      context.fillStyle = '#ffffff55';
      context.fillRect(block.x, block.y, block.width, 3);
    }

    const scenes = [
      { start: 0, label: 'Open sky · Clouds at 10 blocks', top: '#287faf', bottom: '#c5eef3' },
      { start: 10, label: 'Clouds · Space at 20 blocks', top: '#519bd1', bottom: '#edf8ff' },
      { start: 20, label: 'Space · Earth', top: '#080b22', bottom: '#272755' },
      { start: 30, label: 'Mars surface', top: '#5f2c35', bottom: '#eaa37b' },
      { start: 40, label: 'Deep space', top: '#000', bottom: '#000' }
    ];

    function sceneAt(blocks) {
      return scenes.findLast(scene => blocks >= scene.start);
    }

    function ellipse(x, y, rx, ry, color) {
      context.fillStyle = color;
      context.beginPath();
      context.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      context.fill();
    }

    function drawEarth() {
      const x = 270;
      const y = 86;
      const radius = 52;
      const glow = context.createRadialGradient(x - 17, y - 18, 4, x, y, radius);
      glow.addColorStop(0, '#83ebf1');
      glow.addColorStop(1, '#245bb6');
      ellipse(x, y, radius + 2, radius + 2, '#89caff66');
      ellipse(x, y, radius, radius, glow);

      context.save();
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.clip();
      ellipse(x - 15, y - 9, 17, 9, '#61bb87');
      ellipse(x - 8, y + 2, 8, 16, '#61bb87');
      ellipse(x + 23, y + 13, 11, 7, '#69c09a');
      ellipse(x + 13, y - 23, 26, 3, '#ffffff80');
      context.restore();
    }

    function drawStars() {
      for (let i = 0; i < 76; i++) {
        const x = (i * 137 + 19) % width;
        const y = (i * i * 53 + 31) % height;
        const radius = i % 9 === 0 ? 1.6 : 0.8;
        ellipse(x, y, radius, radius, i % 3 === 0 ? '#eef3ff' : '#a5b4e288');
      }
    }

    function drawMars() {
      const ridges = [
        { color: '#ae5e4f', y: 290, points: [46, -35, 90, 5, 143, -24, 190, 11, 263, -49, 320, 8] },
        { color: '#8c453d', y: 337, points: [40, 12, 116, -18, 161, 6, 230, -14, 295, 14] },
        { color: '#67332f', y: 389, points: [64, -10, 136, 12, 220, -12, 298, 8] }
      ];
      for (const ridge of ridges) {
        context.fillStyle = ridge.color;
        context.beginPath();
        context.moveTo(0, ridge.y);
        for (let i = 0; i < ridge.points.length; i += 2) {
          context.lineTo(ridge.points[i], ridge.y + ridge.points[i + 1]);
        }
        context.lineTo(width, ridge.y);
        context.lineTo(width, height);
        context.lineTo(0, height);
        context.closePath();
        context.fill();
      }
      ellipse(75, 415, 29, 6, '#49252288');
      ellipse(283, 433, 46, 9, '#49252288');
    }

    function drawCloud(x, y, scale, color) {
      ellipse(x, y, 48 * scale, 12 * scale, color);
      ellipse(x - 16 * scale, y - 7 * scale, 22 * scale, 15 * scale, color);
      ellipse(x + 12 * scale, y - 13 * scale, 25 * scale, 20 * scale, color);
    }

    function drawSky(time, scene) {
      const sky = context.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, scene.top);
      sky.addColorStop(1, scene.bottom);
      context.fillStyle = sky;
      context.fillRect(0, 0, width, height);

      if (scene.start === 30) {
        drawMars();
        return;
      }
      if (scene.start >= 20) {
        drawStars();
        if (scene.start === 20) drawEarth();
        return;
      }

      const cloudLayer = scene.start === 10;
      if (!cloudLayer) ellipse(279, 62, 25, 25, '#fff2ba');
      const count = cloudLayer ? 9 : 5;
      for (let i = 0; i < count; i++) {
        const x = ((i * 143 + time * (8 + i)) % (width + 190)) - 95;
        const y = cloudLayer ? 48 + i * 46 : 35 + i * 54 + camera * 0.20;
        const scale = cloudLayer ? 1.2 + (i % 3) * 0.22 : 0.9;
        drawCloud(x, y, scale, cloudLayer ? '#f7fcffe8' : '#f3fcffbb');
      }
    }

    function drawWater(time) {
      const surface = ground + camera + 10;
      if (surface >= height + 8) return;
      for (let layer = 0; layer < 3; layer++) {
        context.fillStyle = ['#35aabe', '#228aa6', '#186f90'][layer];
        context.beginPath();
        context.moveTo(0, height);
        for (let x = 0; x <= width; x += 4) {
          const y = surface + layer * 12 + Math.sin(x / 24 - time * (2 + layer)) * 3;
          context.lineTo(x, y);
        }
        context.lineTo(width, height);
        context.closePath();
        context.fill();
      }
    }

    function drawRaft() {
      context.fillStyle = '#704327';
      context.fillRect(82, ground, 196, 15);
      context.fillStyle = '#c88a50';
      context.fillRect(82, ground, 196, 6);
      for (let x = 94; x < 278; x += 24) {
        context.fillStyle = '#dfaa71';
        context.fillRect(x, ground + 2, 3, 12);
      }
    }

    function frame(time) {
      const elapsed = Math.min(0.035, (time - (lastFrame ?? time)) / 1000);
      lastFrame = time;
      sceneryTime += elapsed;
      if (moving) {
        const speed = Math.min(320, 145 + (tower.length - 1) * 9);
        const limit = width - moving.width;
        moving.x += speed * elapsed * moving.direction;
        if (moving.x >= limit || moving.x <= 0) {
          moving.x = Math.max(0, Math.min(limit, moving.x));
          moving.direction = moving.x === 0 ? 1 : -1;
        }
      }

      const target = Math.max(0, 120 - (moving?.y ?? tower.at(-1).y - blockHeight));
      camera += (target - camera) * Math.min(1, elapsed * 10);
      context.setTransform(2, 0, 0, 2, 0, 0);
      const scene = sceneAt(tower.length - 1);
      drawSky(sceneryTime, scene);
      const onRaft = scene.start === 0;
      if (onRaft) drawWater(sceneryTime);
      context.save();
      const bob = onRaft ? Math.sin(sceneryTime * 2.4) * 2 : 0;
      context.translate(0, camera + bob);
      if (onRaft) drawRaft();
      for (const block of tower) {
        if (block.y + camera < height) drawBlock(block);
      }
      if (moving) drawBlock(moving);

      for (const piece of debris) {
        piece.age += elapsed;
        context.save();
        context.translate(piece.x + piece.width / 2 + piece.drift * 40 * piece.age,
          piece.y + blockHeight / 2 + 440 * piece.age ** 2);
        context.rotate(piece.drift * piece.age * 2);
        drawBlock({ ...piece, x: -piece.width / 2, y: -blockHeight / 2 });
        context.restore();
      }
      debris = debris.filter(piece => piece.age < 1.2);
      context.restore();
      requestAnimationFrame(frame);
    }

    action.addEventListener('click', play);
    board.addEventListener('click', play);
    document.addEventListener('keydown', event => {
      if (event.code !== 'Space' || event.altKey || event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      if (!event.repeat) play();
    });

    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
