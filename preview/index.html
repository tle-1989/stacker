<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacker Preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 24px 18px;
      display: grid;
      place-items: center;
      color: #fff0d5;
      background: repeating-linear-gradient(0deg, transparent 0 23px, #643a7325 23px 24px),
                  radial-gradient(ellipse at top, #432056, #150e24 70%);
      font: 0.875rem/1.5 ui-monospace, "Courier New", monospace;
    }
    main {
      width: min(100%, 430px);
      padding: 16px;
      background: #231e26;
      border: 4px solid #bdb39e; border-left-color: #f1e2c0;
      box-shadow: 6px 6px 0 #0b0711, inset 0 0 0 2px #140b22;
    }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
    h1 {
      margin: 0;
      font: clamp(1rem, 5vw, 1.7rem)/1.6 "Press Start 2P", monospace;
      letter-spacing: -.04em;
      text-transform: uppercase;
      color: #ffe264;
      text-shadow: 2px 3px #bd3b74, 4px 5px #100b1b;
    }
    #action, #leaderboard h2 { font: .7rem/1.6 "Press Start 2P", monospace; }
    #score { color: #9cffcd; border: 2px solid #684477; padding: 3px 7px; font-weight: 700; }
    p { color: #e1cce8; margin: 8px 0 12px; }
    .screen { position: relative; border: 4px solid #100b1b; outline: 2px solid #744985; }
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, #10082224 0 1px, transparent 1px 4px);
    }
    canvas {
      width: 100%;
      max-height: 58svh;
      display: block;
      background: #171233;
      image-rendering: pixelated;
      cursor: pointer;
      touch-action: manipulation;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 2px solid #fc7775;
      box-shadow: 0 4px #7c253b;
      background: #d73749;
      color: #fff3da;
      font: inherit;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(2px); box-shadow: 0 2px #9a3c73; }
    :focus-visible { outline: 2px dashed #9cffcd; outline-offset: 3px; }
    #leaderboard { margin-top: 16px; padding: 10px; border: 2px dashed #744985; }
    #leaderboard h2 { margin: 0; color: #ffe264; font-size: 1rem; text-transform: uppercase; }
    #leaderboard ol { margin: 6px 0; padding-left: 24px; }
    #leaderboard p { margin-bottom: 0; }
    #leaderboard input { width: 100%; padding: 8px; font: inherit; }
    #altitude { margin: 12px 0 0; color: #9cffcd; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stacker</h1>
      <span id="score">Score 0</span>
    </header>
    <p>Preview · <a href="../" style="color: #9cffcd">Official game</a></p>
    <p>Line up each block with the one below it. Tap the board or press Space to place it.</p>
    <div class="screen">
    <canvas id="board" width="360" height="450" aria-label="Stacker game board">
      Your browser needs canvas support to play Stacker.
    </canvas>
    </div>
    <button id="action" type="button">Start game</button>
    <p id="altitude">Open sky · Clouds at 10 blocks</p>
    <p id="status" role="status">Ready to play.</p>
    <section id="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">Top 3 players</h2>
      <ol></ol>
      <p role="status">Loading scores…</p>
      <form hidden>
        <label for="player-name">Leaderboard name</label>
        <input id="player-name" required maxlength="24" autocomplete="nickname">
        <button type="submit">Submit score</button>
      </form>
    </section>
  </main>
  <script>
    const board = document.querySelector('#board');
    const context = board.getContext('2d');
    const action = document.querySelector('#action');
    const score = document.querySelector('#score');
    const altitude = document.querySelector('#altitude');
    const status = document.querySelector('#status');

    const width = 360;
    const height = 450;
    const ground = 406;
    const blockHeight = 26;
    const colors = ['#57d894', '#5ca6ec', '#9e83db', '#f087a2', '#ffb75c'];
    let tower;
    let moving;
    let debris;
    let phase;
    let camera;
    let lastFrame;
    let sceneryTime = 0;
    let goldFlash;
    const flashDuration = 0.28;
    const breakDuration = 0.14;
    const alignmentTolerance = 1.5;

    function reset() {
      tower = [{ x: 108, width: 144, y: ground - blockHeight, color: colors[0] }];
      moving = null;
      debris = [];
      camera = 0;
      goldFlash = 0;
      phase = 'ready';
      score.textContent = 'Score 0';
      altitude.textContent = 'Open sky · Clouds at 10 blocks';
    }

    function spawn() {
      const top = tower.at(-1);
      moving = {
        x: 0,
        width: top.width,
        y: top.y - blockHeight,
        color: colors[tower.length % colors.length],
        direction: 1
      };
    }

    function play() {
      if (phase !== 'playing') {
        reset();
        phase = 'playing';
        action.textContent = 'Place block';
        status.textContent = 'Place the block when it lines up.';
        spawn();
        return;
      }

      const top = tower.at(-1);
      const perfect = Math.abs(moving.x - top.x) <= alignmentTolerance;
      if (perfect) {
        moving.x = top.x;
        goldFlash = flashDuration;
      }
      const movingRight = moving.x + moving.width;
      const left = Math.max(moving.x, top.x);
      const right = Math.min(movingRight, top.x + top.width);
      if (right <= left) {
        debris.push({ ...moving, age: 0, drift: moving.direction });
        moving = null;
        phase = 'over';
        action.textContent = 'Play again';
        const finalScore = tower.length - 1;
        status.textContent = 'Game over. Final score ' + finalScore + '.';
        window.dispatchEvent(new CustomEvent('stacker:round-end', { detail: finalScore }));
        return;
      }

      if (moving.x < left) {
        debris.push({ ...moving, width: left - moving.x, age: 0, drift: -1, breaking: true });
      }
      if (movingRight > right) {
        debris.push({ ...moving, x: right, width: movingRight - right, textureOffset: right - moving.x, age: 0, drift: 1, breaking: true });
      }

      tower.push({
        x: left,
        width: right - left,
        y: moving.y,
        color: moving.color,
        textureOffset: left - moving.x
      });
      status.textContent = perfect ? 'Perfect placement!' : 'Place the block when it lines up.';
      const blocks = tower.length - 1;
      score.textContent = 'Score ' + blocks;
      altitude.textContent = sceneAt(blocks).label;
      spawn();
    }

    function drawBlock(block) {
      const x = Math.round(block.x);
      const y = Math.round(block.y);
      const width = Math.max(1, Math.round(block.width));
      const trim = Math.min(3, width);
      context.fillStyle = '#21172e';
      context.fillRect(x, y, width, blockHeight - 1);
      context.fillStyle = block.color;
      context.fillRect(x, y + 1, width, blockHeight - 4);
      context.fillStyle = '#ffffff96';
      context.fillRect(x, y + 1, width, 3);
      context.fillRect(x, y + 4, trim, blockHeight - 9);
      context.fillStyle = '#35164c70';
      context.fillRect(x + width - trim, y + 4, trim, blockHeight - 9);
      context.fillRect(x, y + blockHeight - 7, width, 4);
      context.fillStyle = '#ffffff50';
      for (let tile = 9; tile + 4 < width; tile += 14) {
        context.fillRect(x + tile, y + 9, 4, 2);
        context.fillRect(x + tile + 2, y + 11, 2, 2);
      }
    }

    function drawDebris(piece) {
      const delay = piece.breaking ? breakDuration : 0;
      const fall = Math.max(0, piece.age - delay);
      const center = piece.width / 2;
      context.save();
      context.translate(piece.x + center + piece.drift * 40 * fall,
        piece.y + blockHeight / 2 + 440 * fall ** 2);
      context.rotate(piece.drift * fall * 2);
      drawBlock({ ...piece, x: -center, y: -blockHeight / 2 });

      if (piece.breaking && piece.age < breakDuration) {
        const edge = -piece.drift * center;
        const inset = Math.min(8, piece.width * 0.55);
        context.strokeStyle = '#fff0ce';
        context.lineWidth = 1.5;
        context.beginPath();
        context.moveTo(edge, -blockHeight / 2);
        context.lineTo(edge + piece.drift * inset, -6);
        context.lineTo(edge + piece.drift * inset * 0.35, 1);
        context.lineTo(edge + piece.drift * inset, 7);
        context.lineTo(edge, blockHeight / 2 - 1);
        context.stroke();

        for (let i = 0; i < 5; i++) {
          const distance = piece.age * (65 + i * 11);
          context.fillStyle = i % 2 ? piece.color : '#fff0ce';
          context.fillRect(edge + piece.drift * distance, -10 + i * 4 - distance * 0.3, 2, 2);
        }
      }
      context.restore();
    }

    const scenes = [
      { start: 0, label: 'Open sky · Clouds at 10 blocks', top: '#2654a8', bottom: '#c5eef3' },
      { start: 10, label: 'Clouds · Space at 20 blocks', top: '#3157ac', bottom: '#edf8ff' },
      { start: 20, label: 'Space · Earth', top: '#101330', bottom: '#272755' },
      { start: 30, label: 'Mars surface', top: '#753657', bottom: '#eaa37b' },
      { start: 40, label: 'Deep space', top: '#000', bottom: '#000' }
    ];

    function sceneAt(blocks) {
      return scenes.findLast(scene => blocks >= scene.start);
    }

    function pixels(color, x, y, w, h) {
      context.fillStyle = color;
      context.fillRect(Math.round(x), Math.round(y), w, h);
    }

    const cloudSprite = [
      '....1111........',
      '...122221..11...',
      '..122222211221..',
      '.12222222222221.',
      '1222222222222221',
      '1333223332223331',
      '.11111111111111.'
    ];

    function drawCloud(x, y, size) {
      const palette = { 1: '#5471b7', 2: '#f8f0dc', 3: '#a7c4ea' };
      cloudSprite.forEach((row, dy) => {
        for (let dx = 0; dx < row.length; dx++) {
          if (row[dx] !== '.') pixels(palette[row[dx]], x + dx * size, y + dy * size, size, size);
        }
      });
    }

    function drawStars(time) {
      for (let i = 0; i < 68; i++) {
        const x = (i * 137 + 19) % width;
        const y = (i * i * 53 + 31) % height;
        const bright = (Math.floor(time * 3) + i) % 7 === 0;
        pixels(bright ? '#fff2b8' : '#7182bc', x, y, 2, 2);
        if (bright) {
          pixels('#fff2b8', x - 2, y, 6, 2);
          pixels('#fff2b8', x, y - 2, 2, 6);
        }
      }
    }

    function drawEarth() {
      const orbitStart = 120 - (ground - blockHeight * 22);
      const climb = Math.max(0, Math.min(1, (camera - orbitStart) / (9 * blockHeight)));
      const size = Math.round(8 - climb * 3);
      const centerX = 207 + climb * 36;
      const centerY = 296 + climb * 84;
      const continents = [
        '................', '.....###........', '...######...#...',
        '..######...###..', '...####...####..', '....##....#####.',
        '.....##...###...', '......#....###..', '....####....##..',
        '.....####....#..', '......##........', '......##....##..',
        '......#....###..', '.......#........', '................',
        '................'
      ];
      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          const distance = Math.hypot(x - 7.5, y - 7.5);
          if (distance > 8) continue;
          const land = continents[y][x] === '#';
          const color = distance > 7.1 ? '#8cdaff'
            : land ? (x + y > 17 ? '#227c68' : '#70d66b')
            : x + y > 18 ? '#124197' : '#2689e4';
          pixels(color, centerX + (x - 8) * size, centerY + (y - 8) * size, size, size);
        }
      }
    }

    function drawMars() {
      const ridges = [
        { y: 273, color: '#873a50', peaks: [0, 8, 24, 40, 31, 12, 6, 17, 35, 48, 28, 6] },
        { y: 323, color: '#a74932', peaks: [18, 26, 12, 2, 8, 19, 29, 20, 8, 1, 10, 20] },
        { y: 365, color: '#d17b43', peaks: [6, 14, 20, 12, 8, 14, 6, 3, 3, 12, 21, 18] }
      ];
      for (const { y, color, peaks } of ridges) {
        for (let x = 0; x < width; x += 4) {
          const step = x / 32;
          const i = Math.floor(step);
          const rise = peaks[i] + ((peaks[i + 1] ?? peaks[i]) - peaks[i]) * (step - i);
          const top = y - Math.round(rise / 4) * 4;
          pixels(color, x, top, 4, height - top);
        }
      }
      for (let i = 0; i < 31; i++) {
        const x = (i * 97 + 13) % width;
        const y = 373 + (i * 19) % 74;
        const size = 5 + i % 5 * 3;
        pixels('#8c4237', x, y, size, 4);
        pixels('#eba65e', x + 2, y - 2, size - 3, 2);
      }
    }

    function drawSky(time, scene) {
      pixels(scene.top, 0, 0, width, height);
      if (scene.start === 20 || scene.start === 40) {
        drawStars(time);
        if (scene.start === 20) drawEarth();
        return;
      }
      const bands = scene.start === 30 ? ['#ac5260', '#d88064'] : ['#387bd0', '#5ba9ec'];
      bands.forEach((color, index) => pixels(color, 0, 135 + index * 80, width, height));
      if (scene.start === 30) {
        drawMars();
        return;
      }
      if (scene.start === 0) {
        pixels('#ffe28a', 262, 40, 32, 24);
        pixels('#ffe28a', 266, 36, 24, 32);
      }
      const clouds = scene.start === 10 ? 11 : 5;
      for (let i = 0; i < clouds; i++) {
        const x = Math.floor((i * 127 + time * (6 + i % 4)) % (width + 105)) - 100;
        const y = 51 + i * (scene.start === 10 ? 34 : 51);
        drawCloud(x, y, scene.start === 10 ? 4 + i % 3 : 3);
      }
    }

    function drawWater(time, bob) {
      const surface = Math.round(ground + camera + bob + 9);
      if (surface >= height) return;
      pixels('#174f9b', 0, surface, width, height - surface);
      const phase = Math.floor(time * 9);
      for (let row = 0; row < height - surface; row += 7) {
        for (let x = 0; x < width; x += 4) {
          const tile = (x / 4 + phase + row * 3) % 19;
          if (tile < 6) pixels(row === 0 ? '#a1e8ec' : '#489dd8', x, surface + row, 4, 2);
          if (tile > 13) pixels('#226cba', x, surface + row + 3, 4, 2);
        }
      }
    }

    function drawRaft() {
      pixels('#301921', 78, ground, 204, 15);
      pixels('#db8d42', 82, ground, 196, 5);
      pixels('#9d4930', 82, ground + 5, 196, 7);
      for (let x = 90; x < 275; x += 18) {
        pixels('#63302c', x, ground + 4, 2, 8);
        pixels('#f6bd62', x + 2, ground + 2, 7, 2);
      }
      pixels('#f9e1a1', 98, ground + 1, 7, 10);
      pixels('#f9e1a1', 255, ground + 1, 7, 10);
    }

    let leaderboardTowers = [];
    window.addEventListener('stacker:leaderboard', ({ detail }) => {
      leaderboardTowers = detail.slice(0, 2);
    });

    function drawLeaderboardTowers(bob) {
      const base = ground + camera + bob;
      context.save();
      context.font = '600 11px system-ui, sans-serif';
      context.textAlign = 'center';
      leaderboardTowers.forEach(({ player_name, score }, index) => {
        const x = index === 0 ? 38 : width - 38;
        const top = base - (score + 1) * blockHeight;
        const first = Math.min(score, Math.max(0, Math.floor((base - height) / blockHeight)));
        const end = Math.min(score + 1, Math.ceil(base / blockHeight));

        context.fillStyle = '#17273d66';
        context.strokeStyle = '#e9f2ff70';
        for (let level = first; level < end; level++) {
          const y = base - (level + 1) * blockHeight;
          context.fillRect(x - 17, y, 34, blockHeight - 1);
          context.strokeRect(x - 17.5, y + 0.5, 35, blockHeight - 2);
        }

        const labelY = Math.max(10, Math.min(height - 24, top - 23));
        context.fillStyle = '#101524cc';
        const labelWidth = Math.min(122, Math.max(40, context.measureText(player_name).width + 12));
        const labelX = Math.max(7, Math.min(width - 7 - labelWidth, x - labelWidth / 2));
        context.fillRect(labelX, labelY, labelWidth, 18);
        context.fillStyle = '#f4f6ff';
        context.fillText(player_name, labelX + labelWidth / 2, labelY + 13, labelWidth - 12);
      });
      context.restore();
    }

    function frame(time) {
      const elapsed = Math.min(0.035, (time - (lastFrame ?? time)) / 1000);
      lastFrame = time;
      sceneryTime += elapsed;
      goldFlash = Math.max(0, goldFlash - elapsed);
      if (moving) {
        const speed = Math.min(320, 145 + (tower.length - 1) * 9);
        const limit = width - moving.width;
        moving.x += speed * elapsed * moving.direction;
        if (moving.x >= limit || moving.x <= 0) {
          moving.x = Math.max(0, Math.min(limit, moving.x));
          moving.direction = moving.x === 0 ? 1 : -1;
        }
      }

      const target = Math.max(0, 120 - (moving?.y ?? tower.at(-1).y - blockHeight));
      camera += (target - camera) * Math.min(1, elapsed * 10);
      context.imageSmoothingEnabled = false;
      const scene = sceneAt(tower.length - 1);
      drawSky(sceneryTime, scene);
      const onRaft = scene.start === 0;
      const bob = onRaft ? Math.sin(sceneryTime * 2.4) * 2 : 0;
      if (onRaft) drawWater(sceneryTime, bob);
      drawLeaderboardTowers(bob);
      context.save();
      context.translate(0, camera + bob);
      if (onRaft) drawRaft();
      for (const block of tower) {
        if (block.y + camera >= height) continue;
        drawBlock(block);
        if (goldFlash > 0) {
          context.save();
          context.globalAlpha = Math.min(1, goldFlash / 0.14);
          drawBlock({ ...block, color: '#f8bd3d' });
          context.restore();
        }
      }
      if (moving) drawBlock(moving);

      for (const piece of debris) {
        piece.age += elapsed;
        drawDebris(piece);
      }
      debris = debris.filter(piece => piece.age < 1.2 + breakDuration);
      context.restore();
      requestAnimationFrame(frame);
    }

    action.addEventListener('click', play);
    board.addEventListener('click', play);
    document.addEventListener('keydown', event => {
      if (event.target?.closest?.('#leaderboard')) return;
      if (event.code !== 'Space' || event.altKey || event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      if (!event.repeat) play();
    });

    reset();
    requestAnimationFrame(frame);
  </script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
</body>
</html>
