<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacker Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #101524;
      color: #f4f6ff;
      font: 1rem system-ui, sans-serif;
    }
    main { width: min(100%, 390px); }
    header { display: flex; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 2.5rem; letter-spacing: -.06em; }
    #score { font-variant-numeric: tabular-nums; color: #8cebd7; }
    p { color: #c0c9df; margin: 8px 0 16px; }
    canvas {
      width: 100%;
      max-height: 58svh;
      display: block;
      border: 1px solid #3c4866;
      border-radius: 16px;
      background: #182137;
      cursor: pointer;
      touch-action: manipulation;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #8cebd7;
      color: #101524;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    #leaderboard { margin-top: 18px; padding: 14px; border: 1px solid #3c4866; border-radius: 12px; }
    #leaderboard h2 { margin: 0; font-size: 1.125rem; }
    #leaderboard ol { margin: 8px 0; padding-left: 24px; }
    #leaderboard p { margin-bottom: 0; }
    #leaderboard input { width: 100%; padding: 8px; font: inherit; }
    #altitude { margin: 8px 0 0; font-size: .875rem; color: #8cebd7; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stacker</h1>
      <span id="score">Score 0</span>
    </header>
    <p>Preview · <a href="../" style="color: #8cebd7">Official game</a></p>
    <p>Line up each block with the one below it. Tap the board or press Space to place it.</p>
    <canvas id="board" width="720" height="900" aria-label="Stacker game board">
      Your browser needs canvas support to play Stacker.
    </canvas>
    <button id="action" type="button">Start game</button>
    <p id="altitude">Open sky · Clouds at 10 blocks</p>
    <p id="status" role="status">Ready to play.</p>
    <section id="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">Top 3 players</h2>
      <ol></ol>
      <p role="status">Loading scores…</p>
      <form hidden>
        <label for="player-name">Leaderboard name</label>
        <input id="player-name" required maxlength="24" autocomplete="nickname">
        <button type="submit">Submit score</button>
      </form>
    </section>
  </main>
  <script>
    const board = document.querySelector('#board');
    const context = board.getContext('2d');
    const action = document.querySelector('#action');
    const score = document.querySelector('#score');
    const altitude = document.querySelector('#altitude');
    const status = document.querySelector('#status');

    const width = 360;
    const height = 450;
    const ground = 406;
    const blockHeight = 26;
    const colors = ['#8cebd7', '#8db5ff', '#c2aaff', '#ffaecb', '#ffd39a'];
    let tower;
    let moving;
    let debris;
    let phase;
    let camera;
    let lastFrame;
    const stoneTexture = new Image();
    stoneTexture.src = '../stone.webp';

    let sceneryTime = 0;
    let goldFlash;
    const flashDuration = 0.28;
    const breakDuration = 0.14;
    const alignmentTolerance = 1.5;
    const backdrop = new Image();
    backdrop.src = '../scenery.webp';

    function reset() {
      tower = [{ x: 108, width: 144, y: ground - blockHeight, color: colors[0] }];
      moving = null;
      debris = [];
      camera = 0;
      goldFlash = 0;
      phase = 'ready';
      score.textContent = 'Score 0';
      altitude.textContent = 'Open sky · Clouds at 10 blocks';
    }

    function spawn() {
      const top = tower.at(-1);
      moving = {
        x: 0,
        width: top.width,
        y: top.y - blockHeight,
        color: colors[tower.length % colors.length],
        direction: 1
      };
    }

    function play() {
      if (phase !== 'playing') {
        reset();
        phase = 'playing';
        action.textContent = 'Place block';
        status.textContent = 'Place the block when it lines up.';
        spawn();
        return;
      }

      const top = tower.at(-1);
      const perfect = Math.abs(moving.x - top.x) <= alignmentTolerance;
      if (perfect) {
        moving.x = top.x;
        goldFlash = flashDuration;
      }
      const movingRight = moving.x + moving.width;
      const left = Math.max(moving.x, top.x);
      const right = Math.min(movingRight, top.x + top.width);
      if (right <= left) {
        debris.push({ ...moving, age: 0, drift: moving.direction });
        moving = null;
        phase = 'over';
        action.textContent = 'Play again';
        const finalScore = tower.length - 1;
        status.textContent = 'Game over. Final score ' + finalScore + '.';
        window.dispatchEvent(new CustomEvent('stacker:round-end', { detail: finalScore }));
        return;
      }

      if (moving.x < left) {
        debris.push({ ...moving, width: left - moving.x, age: 0, drift: -1, breaking: true });
      }
      if (movingRight > right) {
        debris.push({ ...moving, x: right, width: movingRight - right, textureOffset: right - moving.x, age: 0, drift: 1, breaking: true });
      }

      tower.push({
        x: left,
        width: right - left,
        y: moving.y,
        color: moving.color,
        textureOffset: left - moving.x
      });
      status.textContent = perfect ? 'Perfect placement!' : 'Place the block when it lines up.';
      const blocks = tower.length - 1;
      score.textContent = 'Score ' + blocks;
      altitude.textContent = sceneAt(blocks).label;
      spawn();
    }

    function drawBlock(block) {
      const { x, y, width, color } = block;
      const faceHeight = blockHeight - 1;
      const bevel = Math.min(3, width / 3);
      const gold = color === '#f8bd3d';
      const lighting = context.createLinearGradient(0, y, 0, y + faceHeight);
      lighting.addColorStop(0, '#ffffff55');
      lighting.addColorStop(0.45, '#ffffff00');
      lighting.addColorStop(1, '#171d2b88');

      context.save();
      context.beginPath();
      context.moveTo(x + bevel, y);
      context.lineTo(x + width - bevel, y);
      context.lineTo(x + width, y + bevel);
      context.lineTo(x + width, y + faceHeight - bevel);
      context.lineTo(x + width - bevel, y + faceHeight);
      context.lineTo(x + bevel, y + faceHeight);
      context.lineTo(x, y + faceHeight - bevel);
      context.lineTo(x, y + bevel);
      context.closePath();
      context.fillStyle = color;
      context.fill();
      context.clip();

      if (stoneTexture.naturalWidth) {
        const opacity = context.globalAlpha;
        context.globalAlpha *= gold ? 0.12 : 0.46;
        context.drawImage(stoneTexture,
          (block.textureOffset ?? 0) * 2, 0, width * 2, faceHeight * 2,
          x, y, width, faceHeight);
        context.globalAlpha = opacity;
      }

      context.fillStyle = lighting;
      context.fillRect(x, y, width, faceHeight);
      context.fillStyle = gold ? '#fff2baaa' : '#ffffff85';
      context.fillRect(x, y, width, bevel);
      context.fillRect(x, y + bevel, bevel, faceHeight - bevel);
      context.fillStyle = '#1a223966';
      context.fillRect(x, y + faceHeight - bevel, width, bevel);
      context.fillRect(x + width - bevel, y + bevel, bevel, faceHeight - bevel);
      context.restore();
    }

    function drawDebris(piece) {
      const delay = piece.breaking ? breakDuration : 0;
      const fall = Math.max(0, piece.age - delay);
      const center = piece.width / 2;
      context.save();
      context.translate(piece.x + center + piece.drift * 40 * fall,
        piece.y + blockHeight / 2 + 440 * fall ** 2);
      context.rotate(piece.drift * fall * 2);
      drawBlock({ ...piece, x: -center, y: -blockHeight / 2 });

      if (piece.breaking && piece.age < breakDuration) {
        const edge = -piece.drift * center;
        const inset = Math.min(8, piece.width * 0.55);
        context.strokeStyle = '#fff0ce';
        context.lineWidth = 1.5;
        context.beginPath();
        context.moveTo(edge, -blockHeight / 2);
        context.lineTo(edge + piece.drift * inset, -6);
        context.lineTo(edge + piece.drift * inset * 0.35, 1);
        context.lineTo(edge + piece.drift * inset, 7);
        context.lineTo(edge, blockHeight / 2 - 1);
        context.stroke();

        for (let i = 0; i < 5; i++) {
          const distance = piece.age * (65 + i * 11);
          context.fillStyle = i % 2 ? piece.color : '#fff0ce';
          context.fillRect(edge + piece.drift * distance, -10 + i * 4 - distance * 0.3, 2, 2);
        }
      }
      context.restore();
    }

    const scenes = [
      { start: 0, label: 'Open sky · Clouds at 10 blocks', top: '#287faf', bottom: '#c5eef3' },
      { start: 10, label: 'Clouds · Space at 20 blocks', top: '#519bd1', bottom: '#edf8ff' },
      { start: 20, label: 'Space · Earth', top: '#080b22', bottom: '#272755' },
      { start: 30, label: 'Mars surface', top: '#5f2c35', bottom: '#eaa37b' },
      { start: 40, label: 'Deep space', top: '#000', bottom: '#000' }
    ];

    function sceneAt(blocks) {
      return scenes.findLast(scene => blocks >= scene.start);
    }

    function ellipse(x, y, rx, ry, color) {
      context.fillStyle = color;
      context.beginPath();
      context.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      context.fill();
    }

    function drawEarth() {
      // Follow the smoothed camera so Earth recedes continuously as we climb.
      const orbitStart = 120 - (ground - blockHeight * 22);
      const progress = Math.max(0, Math.min(1, (camera - orbitStart) / (9 * blockHeight)));
      const x = 200 + progress * 42;
      const y = 298 + progress * 84;
      const radius = 83 - progress * 36;

      if (backdrop.naturalWidth) {
        // The globe occupies this region of the scenery atlas's lower-left tile.
        const sx = backdrop.naturalWidth / 1122;
        const sy = backdrop.naturalHeight / 1402;
        context.save();
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.clip();
        context.drawImage(backdrop, 164 * sx, 738 * sy, 232 * sx, 232 * sy,
          x - radius, y - radius, radius * 2, radius * 2);
        context.restore();
        return;
      }
      const glow = context.createRadialGradient(x - 17, y - 18, 4, x, y, radius);
      glow.addColorStop(0, '#83ebf1');
      glow.addColorStop(1, '#245bb6');
      ellipse(x, y, radius + 2, radius + 2, '#89caff66');
      ellipse(x, y, radius, radius, glow);

      context.save();
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.clip();
      ellipse(x - 15, y - 9, 17, 9, '#61bb87');
      ellipse(x - 8, y + 2, 8, 16, '#61bb87');
      ellipse(x + 23, y + 13, 11, 7, '#69c09a');
      ellipse(x + 13, y - 23, 26, 3, '#ffffff80');
      context.restore();
    }

    function drawStars() {
      for (let i = 0; i < 76; i++) {
        const x = (i * 137 + 19) % width;
        const y = (i * i * 53 + 31) % height;
        const radius = i % 9 === 0 ? 1.6 : 0.8;
        ellipse(x, y, radius, radius, i % 3 === 0 ? '#eef3ff' : '#a5b4e288');
      }
    }

    function drawMars() {
      const ridges = [
        { color: '#ae5e4f', y: 290, points: [46, -35, 90, 5, 143, -24, 190, 11, 263, -49, 320, 8] },
        { color: '#8c453d', y: 337, points: [40, 12, 116, -18, 161, 6, 230, -14, 295, 14] },
        { color: '#67332f', y: 389, points: [64, -10, 136, 12, 220, -12, 298, 8] }
      ];
      for (const ridge of ridges) {
        context.fillStyle = ridge.color;
        context.beginPath();
        context.moveTo(0, ridge.y);
        for (let i = 0; i < ridge.points.length; i += 2) {
          context.lineTo(ridge.points[i], ridge.y + ridge.points[i + 1]);
        }
        context.lineTo(width, ridge.y);
        context.lineTo(width, height);
        context.lineTo(0, height);
        context.closePath();
        context.fill();
      }
      ellipse(75, 415, 29, 6, '#49252288');
      ellipse(283, 433, 46, 9, '#49252288');
    }

    function drawCloud(x, y, scale, color) {
      ellipse(x, y, 48 * scale, 12 * scale, color);
      ellipse(x - 16 * scale, y - 7 * scale, 22 * scale, 15 * scale, color);
      ellipse(x + 12 * scale, y - 13 * scale, 25 * scale, 20 * scale, color);
    }

    function drawSky(time, scene) {
      if (scene.start < 40 && scene.start !== 20 && backdrop.naturalWidth) {
        const tileWidth = backdrop.naturalWidth / 2;
        const tileHeight = backdrop.naturalHeight / 2;
        const tile = scene.start / 10;
        const padding = 8;
        context.drawImage(backdrop,
          (tile % 2) * tileWidth + padding, Math.floor(tile / 2) * tileHeight + padding,
          tileWidth - padding * 2, tileHeight - padding * 2, 0, 0, width, height);
        return;
      }
      const sky = context.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, scene.top);
      sky.addColorStop(1, scene.bottom);
      context.fillStyle = sky;
      context.fillRect(0, 0, width, height);

      if (scene.start === 30) {
        drawMars();
        return;
      }
      if (scene.start >= 20) {
        drawStars();
        if (scene.start === 20) drawEarth();
        return;
      }

      const cloudLayer = scene.start === 10;
      if (!cloudLayer) ellipse(279, 62, 25, 25, '#fff2ba');
      const count = cloudLayer ? 9 : 5;
      for (let i = 0; i < count; i++) {
        const x = ((i * 143 + time * (8 + i)) % (width + 190)) - 95;
        const y = cloudLayer ? 48 + i * 46 : 35 + i * 54 + camera * 0.20;
        const scale = cloudLayer ? 1.2 + (i % 3) * 0.22 : 0.9;
        drawCloud(x, y, scale, cloudLayer ? '#f7fcffe8' : '#f3fcffbb');
      }
    }

    function drawWater(time) {
      const surface = ground + camera + 10;
      if (surface >= height + 8) return;
      for (let layer = 0; layer < 3; layer++) {
        context.fillStyle = ['#35aabe', '#228aa6', '#186f90'][layer];
        context.beginPath();
        context.moveTo(0, height);
        for (let x = 0; x <= width; x += 4) {
          const y = surface + layer * 12 + Math.sin(x / 24 - time * (2 + layer)) * 3;
          context.lineTo(x, y);
        }
        context.lineTo(width, height);
        context.closePath();
        context.fill();
      }
    }

    function drawRaft() {
      context.fillStyle = '#704327';
      context.fillRect(82, ground, 196, 15);
      context.fillStyle = '#c88a50';
      context.fillRect(82, ground, 196, 6);
      for (let x = 94; x < 278; x += 24) {
        context.fillStyle = '#dfaa71';
        context.fillRect(x, ground + 2, 3, 12);
      }
    }

    let leaderboardTowers = [];
    window.addEventListener('stacker:leaderboard', ({ detail }) => {
      leaderboardTowers = detail.slice(0, 2);
    });

    function drawLeaderboardTowers(bob) {
      const base = ground + camera + bob;
      context.save();
      context.font = '600 11px system-ui, sans-serif';
      context.textAlign = 'center';
      leaderboardTowers.forEach(({ score }, index) => {
        const x = index === 0 ? 38 : width - 38;
        const top = base - (score + 1) * blockHeight;
        const first = Math.min(score, Math.max(0, Math.floor((base - height) / blockHeight)));
        const end = Math.min(score + 1, Math.ceil(base / blockHeight));

        context.fillStyle = '#17273d66';
        context.strokeStyle = '#e9f2ff70';
        for (let level = first; level < end; level++) {
          const y = base - (level + 1) * blockHeight;
          context.fillRect(x - 17, y, 34, blockHeight - 1);
          context.strokeRect(x - 17.5, y + 0.5, 35, blockHeight - 2);
        }

        const labelY = Math.max(10, Math.min(height - 24, top - 23));
        context.fillStyle = '#101524cc';
        context.fillRect(x - 31, labelY, 62, 18);
        context.fillStyle = '#f4f6ff';
        context.fillText('#' + (index + 1) + ' · ' + score, x, labelY + 13, 56);
      });
      context.restore();
    }

    function frame(time) {
      const elapsed = Math.min(0.035, (time - (lastFrame ?? time)) / 1000);
      lastFrame = time;
      sceneryTime += elapsed;
      goldFlash = Math.max(0, goldFlash - elapsed);
      if (moving) {
        const speed = Math.min(320, 145 + (tower.length - 1) * 9);
        const limit = width - moving.width;
        moving.x += speed * elapsed * moving.direction;
        if (moving.x >= limit || moving.x <= 0) {
          moving.x = Math.max(0, Math.min(limit, moving.x));
          moving.direction = moving.x === 0 ? 1 : -1;
        }
      }

      const target = Math.max(0, 120 - (moving?.y ?? tower.at(-1).y - blockHeight));
      camera += (target - camera) * Math.min(1, elapsed * 10);
      context.setTransform(2, 0, 0, 2, 0, 0);
      const scene = sceneAt(tower.length - 1);
      drawSky(sceneryTime, scene);
      const onRaft = scene.start === 0;
      if (onRaft) drawWater(sceneryTime);
      const bob = onRaft ? Math.sin(sceneryTime * 2.4) * 2 : 0;
      drawLeaderboardTowers(bob);
      context.save();
      context.translate(0, camera + bob);
      if (onRaft) drawRaft();
      for (const block of tower) {
        if (block.y + camera >= height) continue;
        drawBlock(block);
        if (goldFlash > 0) {
          context.save();
          context.globalAlpha = Math.min(1, goldFlash / 0.14);
          context.shadowColor = '#ffd76a';
          context.shadowBlur = 12;
          drawBlock({ ...block, color: '#f8bd3d' });
          context.restore();
        }
      }
      if (moving) drawBlock(moving);

      for (const piece of debris) {
        piece.age += elapsed;
        drawDebris(piece);
      }
      debris = debris.filter(piece => piece.age < 1.2 + breakDuration);
      context.restore();
      requestAnimationFrame(frame);
    }

    action.addEventListener('click', play);
    board.addEventListener('click', play);
    document.addEventListener('keydown', event => {
      if (event.target?.closest?.('#leaderboard')) return;
      if (event.code !== 'Space' || event.altKey || event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      if (!event.repeat) play();
    });

    reset();
    requestAnimationFrame(frame);
  </script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
</body>
</html>
